appId: "com.phlhar.stream-monitor"
productName: "Stream Monitor"
artifactName: "${name}-${version}-${os}-${arch}.${ext}"
directories:
  output: release-builds
afterPack: scripts/afterPack.js

# OS specific settings
mac:
  icon: "icon/icon.ico"
  # Required so macOS shows the Local Network permission prompt
  # (multicast RTP/SAP reception and mDNS registry discovery).
  extendInfo:
    NSLocalNetworkUsageDescription: >-
      Stream Monitor discovers and receives AES67/NMOS audio streams
      (SAP, RTP multicast) and locates NMOS registries via mDNS on the
      local network.
    NSBonjourServices:
      - _nmos-register._tcp
      - _nmos-registration._tcp
      - _nmos-query._tcp
      - _http._tcp
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  icon: "icon/icon.png"
  target:
    - target: msi
      arch: [x64]
    - target: zip
      arch: [x64]

linux:
  icon: "icon/icon.png"
  target:
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

# Target specific settings
msi:
  oneClick: false
